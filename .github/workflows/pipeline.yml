name: CI/CD Pipeline

# Se dispara en push/PR a main, y también cuando se crea un tag
# de versión (v1.0.0, v1.1.0, etc.) — eso es lo que dispara el
# job de release con versionado real.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# Variable compartida por todos los jobs: nombre de la imagen
# en Docker Hub. Se arma con el usuario del repo automáticamente.
env:
  IMAGE_NAME: ${{ vars.DOCKERHUB_USERNAME || 'usuario' }}/cicd-pipeline-demo

jobs:
  # ------------------------------------------------------------
  # ETAPA 1: Lint — la más rápida y barata. Si falla acá, no
  # tiene sentido gastar tiempo de CI en las etapas siguientes.
  # ------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install flake8
      - run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  # ------------------------------------------------------------
  # ETAPA 2: Tests — corre en matrix (dos versiones de Python)
  # para detectar incompatibilidades antes de llegar a producción.
  # ------------------------------------------------------------
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  # ------------------------------------------------------------
  # ETAPA 3: Build & Push — arma la imagen Docker y la publica
  # en Docker Hub. Solo corre en push a main (no en PRs, para no
  # publicar imágenes de código todavía sin revisar).
  # Usa DOS tags: el SHA del commit (trazabilidad exacta de qué
  # código generó esa imagen) y "latest" (para consumo simple).
  # ------------------------------------------------------------
  build-and-push:
    name: Build & Push image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build y push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  # ------------------------------------------------------------
  # ETAPA 4: Release — solo corre cuando se pushea un tag de
  # versión (ej: git tag v1.2.0). Publica la imagen con ese
  # número de versión real, y crea un Release en GitHub.
  # ------------------------------------------------------------
  release:
    name: Release versionado
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build y push con tag de versión
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.ref_name }}

      - name: Crear Release en GitHub
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  # ------------------------------------------------------------
  # ETAPA 5: Deploy (simulado) — representa el paso donde en un
  # caso real se actualizaría un servicio corriendo (ej: kubectl
  # set image, o un webhook a la plataforma de hosting). Usa un
  # "environment" de GitHub, que permite exigir aprobación manual
  # antes de desplegar a producción.
  # ------------------------------------------------------------
  deploy:
    name: Deploy a staging
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: staging
    steps:
      - name: Simular despliegue
        run: |
          echo "Desplegando ${{ env.IMAGE_NAME }}:${{ github.sha }} a staging"
          echo "(Acá iría, por ejemplo, un 'kubectl set image' o una llamada a la API del hosting)"
